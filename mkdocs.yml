site_name: "Simplicollect – Manuels"
site_description: Manuels d'installation et d'utilisation de Simplicollect / Installation and user manuals
# site_url: https://<your-host>/<path>/      # set when the site is published
# repo_url: https://github.com/uHistorian/<repo>
# edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: fr
  font: false
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Passer au mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Passer au mode clair

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: fr
          default: true
          name: Français
          build: true
        - locale: en
          name: English
          build: true
          site_name: "Simplicollect – Manuals"
          nav_translations:
            "Accueil": "Home"
            "Manuel d'installation et de mise en service": "Installation and Commissioning Manual"
            "Passerelle Simplicollect": "Simplicollect Gateway"
            "Installation et raccordement de la passerelle MINI": "Installing and connecting the MINI gateway"
            "Exemple de configuration d'un routeur pour la configuration des ports": "Router configuration example for port forwarding"
            "Raccordement à Internet": "Connecting to the Internet"
            "Session Windows 10": "Windows 10 session"
            "Session Linux (SSH)": "Linux session (SSH)"
            "Modules Simplicollect": "Simplicollect Modules"
            "Unité solaire/batterie et collecte de données": "Solar/battery unit and data collection"
            "Module sans fil- Panneau solaire et batterie": "Wireless module - Solar panel and battery"
            "Remplacement SIM": "SIM replacement"
            "Module MaestrEau et Irrigation": "MaestrEau Module and Irrigation"
            "Configuration de la connexion Wifi et de l'adresse IP": "Wi-Fi connection and IP address configuration"
            "Remplacement SIM sur MaestrEau": "SIM replacement on MaestrEau"
            "Manuel d'utilisation": "User Manual"
            "Groupes Tags": "Tag Groups"
            "Paramètres": "Settings"
            "Sécurité": "Security"
            "Aires et Zones": "Areas and Zones"
            "Scénarios": "Scenarios"
            "MaestrEau - Utilisation": "MaestrEau - Usage"
            "Opérations": "Operations"
            "État des Zones": "Zone Status"
            "MaestrEau sur iPhone": "MaestrEau on iPhone"
            "MaestrEau sur Android": "MaestrEau on Android"
            "Dataview sur Web": "Dataview on Web"
            "Dataview sur iPhone": "Dataview on iPhone"
            "Dataview sur Android": "Dataview on Android"
            "Utilitaire de configuration des modules": "Module Configuration Utility"
            "Utilitaire de configuration VirtualHub": "VirtualHub Configuration Utility"
            "Changement de mot de passe": "Changing a password"
            "SimpliMétéo": "SimpliWeather"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - "Accueil": index.md
  - "Manuel d'installation et de mise en service":
      - manuel-d-installation-et-de-mise-en-service/index.md
      - "Passerelle Simplicollect":
