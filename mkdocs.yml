          - "Exemple de configuration d'un routeur pour la configuration des ports": manuel-d-installation-et-de-mise-en-service/passerelle-simplicollect/exemple-de-configuration-d-un-routeur-pour-la-configuration-des-ports.md
          - "Raccordement à Internet": manuel-d-installation-et-de-mise-en-service/passerelle-simplicollect/raccordement-a-internet.md
          - "Session Windows 10": manuel-d-installation-et-de-mise-en-service/passerelle-simplicollect/session-windows-10.md
          - "Session Linux (SSH)": manuel-d-installation-et-de-mise-en-service/passerelle-simplicollect/session-linux-ssh.md
      - "Modules Simplicollect":
