name: Check documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mkdocs<2" "mkdocs-material==9.7.6" "mkdocs-static-i18n==1.3.1"
      - run: mkdocs build --strict
